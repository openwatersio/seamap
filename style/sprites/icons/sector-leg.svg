<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- A sector limit, drawn outward from the light. Proportioned so that at the icon-size which
     makes it 25 mm long (S-52 LIGHTS06) the stroke lands at 1 unit / 0.32 mm and the dashes stay
     above a pixel. Grey rather than CHBLK black: a busy sector light should not read as a hazard
     boundary, which S-4 B-475.1 permits.

     The stroke duplicates `colors.sectorLeg` in style/layers/palette.ts. A sprite cannot be
     recoloured from the style — icon-color needs an SDF sheet, and spreet builds SDF per sheet,
     not per icon — so the two have to be changed together. -->
<svg width="8" height="256" viewBox="0 0 8 256" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <path d="M 4,0 V 256"
        style="fill:none;stroke:#666666;stroke-width:3.24;stroke-dasharray:8,8;stroke-linecap:butt" />
</svg>
