name: Republish manifest

# Rewrites seamap/<version>.json + seamap/latest.json as TileJSON, pointing at an
# already-uploaded pmtiles. No rebuild and no re-upload — use it to migrate the
# manifest format or to roll `latest` back to a previous version.
#
# Required repo secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to point latest at (e.g. 2026-06-14)"
        required: true

permissions:
  contents: read

jobs:
  republish:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: https://7822da9c68cfce969e63d07534969359.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tiles
      PUBLIC_BASE_URL: https://tiles.openwaters.io
      MANIFEST_ONLY: "1"
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Republish manifest
        run: |
          # Safety: don't repoint `latest` at a version whose pmtiles is missing.
          curl -fsI "$PUBLIC_BASE_URL/seamap/$VERSION.pmtiles" >/dev/null \
            || { echo "seamap/$VERSION.pmtiles not found on R2" >&2; exit 1; }
          bin/publish
