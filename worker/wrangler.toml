compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"
name = "seamap-tiles"

# Mounted under the unified tiles host by path prefix. `wrangler dev` ignores
# this and serves at localhost:8788 root — the worker tolerates the /seamap
# prefix being present (prod) or absent (dev). Keep in sync with BASE_PATH below.
routes = [
  {pattern = "tiles.openwaters.io/seamap/*", zone_name = "openwaters.io"},
]

# R2 bucket holding seamap/<version>.pmtiles and the seamap/latest pointer that
# names the current version. `wrangler dev` backs this with a LOCAL sim —
# populate it from a local build via `npm run seed` (see seed.sh).
[[r2_buckets]]
binding = "TILES"
bucket_name = "tiles"

# The chart sprite sheet, served under <mount>/sprites. Generated by bin/sprites
# (needs spreet) and gitignored — build it before deploying or the style's
# symbols resolve to nothing.
[assets]
directory = "../style/sprites/dist"
binding = "ASSETS"

[vars]
# URL mount path; must match the route prefix above. "" would serve at root.
BASE_PATH = "/seamap"

[observability.logs]
enabled = true
invocation_logs = true
